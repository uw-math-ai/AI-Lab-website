name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_root_domain:
        description: Build for ai.math.uw.edu even if GitHub Pages settings have not propagated yet.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build SvelteKit site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Svelte project
        run: npm run check

      - name: Detect Pages custom domain
        id: pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pages_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" || true)"
          custom_domain="$(printf '%s' "${pages_json}" | node -e "let s=''; process.stdin.on('data', d => s += d); process.stdin.on('end', () => { try { console.log(JSON.parse(s).cname || '') } catch { console.log('') } })")"
          echo "custom_domain=${custom_domain}" >> "${GITHUB_OUTPUT}"
          if [ "${custom_domain}" = "ai.math.uw.edu" ]; then
            echo "Detected official custom domain: ${custom_domain}"
          else
            echo "No official custom domain detected; building for /AI-Lab-website."
          fi

      - name: Build static site
        env:
          FORCE_ROOT_DOMAIN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_root_domain == true }}
        run: |
          if [ "${FORCE_ROOT_DOMAIN}" = "true" ]; then
            echo "Manual root-domain build requested."
            npm run build
          elif [ "${{ steps.pages.outputs.custom_domain }}" = "ai.math.uw.edu" ]; then
            npm run build
          else
            npm run build:ai-lab
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy SvelteKit site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

- title: CayleyPy - Artificial intelligence methods for group and graph theories
  speaker: Alexander Chervov, Institut Curie
  date: 2025-10-24
  startTime: 12:30
  endTime: 13:30
  location: PDL-C38 and Zoom
  type: Seminar
  sourceUrl: https://math.washington.edu/events/2025-10-24/cayleypy-artificial-intelligence-methods-group-and-graph-theories
  abstract: |-
    We will present an AI-based open source Python library "CayleyPy" which can handle googol-size Cayley graphs and significantly outperforms classical computer algebra systems GAP/SAGE for several tasks. Hundreds conjectures and several results were obtained with its help. Classical group theory tasks e.g. decomposition of the group elements, can be rephrased as standard reinforcement learning tasks, and approached in a similar manner as Google Deepmind's AlphaGo/Zero.

    We will also give an overview of various recent achievements in "AI for math" emerging field of research. The talk will be based on: arXiv:2509.19162, arXiv:2502.18663, arXiv:2502.13266.
- title: "Seed-Prover: Deep and Broad Reasoning for Automated Theorem Proving"
  speaker: Vasily Ilin
  date: 2025-10-17
  startTime: 12:30
  endTime: 13:30
  location: PDL-C38 and Zoom
  type: Seminar
  sourceUrl: https://math.washington.edu/events/2025-10-17/seed-prover-deep-and-broad-reasoning-automated-theorem-proving
  abstract: Seed-Prover is the current best Lean model, achieving 100% on minif2f, 50% on PutnamBench
    and gold-level performance on the 2025 IMO. I will briefly survey the history of formal theorem
    proving and talk about the Seed-Prover paper. You do not need to know Lean to understand the
    talk.
- title: "AI Meets Mathematics: A Survey of Recent Breakthroughs and Emerging Directions"
  speaker: Carina Hong (Stanford Math / Stanford Law / Axiom AI)
  date: 2025-05-30
  startTime: 15:30
  endTime: 16:30
  location: PDL C-38
  type: Seminar
  sourceUrl: https://math.washington.edu/events/2025-05-30/ai-meets-mathematics-survey-recent-breakthroughs-and-emerging-directions
  abstract: |-
    Abstract:

    The field of AI for Mathematics has moved its focus from solving benchmark problems with numerical solutions to generating formal proofs to research-level mathematical questions. In this survey talk we will cover recent developments and future directions in AI4Math, including the following three topics:

    1. Formalization and auto-formalization, where natural language math contents (with LaTeX formulas) is converted into Lean, Isabelle, and Coq programs.

    2. Automated theorem proving using LLMs, where transformer-based models now guide symbolic search of formal proofs and achieve competitive performances on benchmarks such as Mini-F2F and PutnamBench.
    3. Conjecturing, where programming language helps with new knowledge generation in Euclidean Geometry and pairing conjecturer and prover gives advances in performance.
- title: Formalizing Engineering Mathematics with Lean
  speaker: Eric Klavins, Proffessor at ECE, UW
  date: 2025-04-17
  startTime: 15:00
  endTime: 16:00
  location: PDL C-38
  type: Seminar
  sourceUrl: https://math.washington.edu/events/2025-04-17/formalizing-engineering-mathematics-lean
  abstract: |-
    I will describe our recent efforts to formalize, in Lean, fundamental concepts from engineering mathematics including signal processing, control theory, and formal verification. I'll start with an overview of the relationship between programming languages and formal logic, which provides an astounding avenue for programmers and engineers to learn and hopefully contribute to mathematics. I will give several examples of projects engineering students have explored.

    I will then discuss various challenges, mainly to do with rigorous software engineering, that must be overcome before this kind of framework can be widely adopted in engineering.
- title: Lower bounds on neural networks and slicing the hypercube
  speaker: Gal Yehuda, Yale University
  date: 2025-03-18
  startTime: 14:30
  endTime: 15:30
  location: PDL C-38
  type: Seminar
  sourceUrl: https://math.washington.edu/events/2025-03-18/lower-bounds-neural-networks-and-slicing-hypercube
  abstract: |-
    Abstract:

    What is the size of the smallest neural network that computes the parity function? How many hyperplanes are needed to slice the Boolean hypercube? In this talk we will discuss the connection between the problems as well as lower bounds, using methods from convex geometry, probability and combinatorics.

- title: Formalizing mathematics in the eXperimental Lean Lab
  speaker: Experimental Lean Lab
  date: 2024-12-03
  startTime: 16:30
  endTime: 17:30
  location: CMU B-006
  type: Information Session
  sourceUrl: https://math.washington.edu/events/2024-12-03/formalizing-mathematics-experimental-lean-lab
  abstract: |-
    The eXperimental Lean Lab will showcase using Lean to formalize real mathematics. We have five groups formalizing 1) generating functions, 2) central limit theorem, 3) topology for algebraic geometry, 4) examples in commutative algebra, and 5) metaprogramming in Lean.

    If you have been curious about using computers for proof assistance and verification, this talk is for you!
- title: Generating Functions in Lean
  speaker: Herman Chau, University of Washington
  date: 2024-05-20
  startTime: 13:00
  endTime: 14:20
  location: Denny Hall (DEN), 113
  type: Seminar
  sourceUrl: https://math.washington.edu/events/2024-05-20/generating-functions-lean
  abstract: In this talk, we will walk through how to formalize some examples from Herbert Wilf's
    "generatingfunctionology". We'll see how to define and work with power series in Lean, and work
    our way towards proving the closed form formula for the Fibonacci numbers. Along the way, we
    will discuss ways to structure Lean code to be readable from a mathematician's point of view.

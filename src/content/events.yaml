- title: "Geometry and Expressivity of Neuromanifolds: Where Algebraic Geometry Meets Neural Networks"
  speaker: Maksym Zubkov
  date: 2025-12-05
  startTime: 12:30
  endTime: 13:30
  location: PDL C-38
  type: Seminar
  sourceUrl: https://math.washington.edu/events/2025-12-05/geometry-and-expressivity-neuromanifolds-where-algebraic-geometry-meets-neural
  abstract: |-
    In this talk, I will give an overview of neuroalgebraic geometry, a new field, analogous to algebraic statistics, that uses algebraic geometry to understand different neural network architectures. Our main object of study will be a neuromanifold and its expressivity.

    A neuromanifold is defined as an embedding of the parameter space of a fixed neural network into a fixed ambient space of functions, while expressivity is defined as the capability of a neural network to approximate an element in the ambient space arbitrarily well. We will consider two types of activation functions: polynomial and rational.

    For each of these activation functions, we will construct the Zariski closure of a neuromanifold, called a neurovariety, and show that understanding the geometry of a neuromanifold or neurovariety is equivalent to understanding long-standing and beautiful objects of classical algebraic geometry such as secant varieties, Chow varieties, and others.

    Finally, we will briefly discuss analogues of neuromanifolds over finite fields and show how simple point-counting can reveal further insights into the expressivity of neural networks and the geometry of a neuromanifold over the complex or real numbers.
- title: Machine Learning for Accelerating Mathematical Discovery in Algebraic Combinatorics
  speaker: Henry Kvinge, PNNL & UW
  date: 2025-11-21
  startTime: 12:30
  endTime: 13:30
  location: C-038
  type: Seminar
  sourceUrl: https://math.washington.edu/events/2025-11-21/machine-learning-accelerating-mathematical-discovery-algebraic-combinatorics-nbsp
  abstract: |-
    Examples play a critical role in the mathematician’s workflow, enabling us to explore unfamiliar mathematical landscapes, building intuition and generating conjectures along the way. Of course, there are many settings where a far greater number of examples can be generated than could be manually examined by any one person. On the other hand, recent progress in AI has resulted in pattern recognition capabilities that can capture nuanced structural features in data at huge scales.

    In this talk we discuss the use of AI for conjecture generation in algebraic combinatorics. We will start by describing what we have learned about the process of putting together a ‘math dataset’ aimed at machine learning. We then describe our Algebraic Combinatorics Dataset Repository where we translated open problems and foundational results into a machine learning friendly format.

    We then discuss a specific example where we used graph neural networks and mechanistic interpretability to re-discover several theorems which characterize mutation equivalence classes of quivers.
- title: "Proving and Improving: Language Models for Theorem Proving and Proof Shortening in Lean"
  speaker: Alex Gu
  date: 2025-10-31
  startTime: 12:30
  endTime: 13:30
  location: PDL C-038
  type: Seminar
  sourceUrl: https://math.washington.edu/events/2025-10-31/proving-and-improving-language-models-theorem-proving-and-proof-shortening-lean
  abstract: |-
    Large language models (LLMs) have made steady progress in formal mathematics, achieving near-International Mathematical Olympiad (IMO) performance. This talk presents two complementary advances toward more capable and interpretable formal proving systems. First, we introduce LeanDojo, a foundational open-source toolkit bridging ML and Lean, enabling large-scale data extraction, interactive training, and the development of ReProver, a retrieval-augmented Lean prover.

    Next, we turn to a critical challenge: proofs produced by LLMs are often unnecessarily long, redundant, and opaque. To mitigate this, we introduce ProofOptimizer, a system that automatically simplifies Lean proofs while preserving correctness. It combines symbolic linting, a fine-tuned 7B model, and iterative refinement, reducing proof length by up to 87% on MiniF2F and 57% on PutnamBench, even halving some IMO-level proofs.

    Together, these systems demonstrate how AI can make automated proofs not only possible, but also increasingly comprehensible.

- title: Verifiable PDE Reasoning and Modeling with Neurosymbolics
  speaker: Wuyang Chen, Simon Fraser University, Assistant Professor
  date: 2026-01-23
  startTime: 15:30
  endTime: 16:30
  location: CMU B-006
  type: Seminar
  sourceUrl: https://math.washington.edu/events/2026-01-23/verifiable-pde-reasoning-and-modeling-neurosymbolics
  abstract: |-
    Recent progress in LLMs has transformed text and code generation, yet models still falter on PDEs (partial differential equation) where correctness, constraints, and physical consequences are critical. This talk explores how formal LLM reasoning can advance symbolic PDE modeling. First, our PDE-Controller formalizes informal PDEs, synthesizes solver-ready code, and plans subgoals to tackle nonconvex control via interactions with external solvers.

    Second, our Lean Finder accelerates PDE formalization with a semantics-aware search engine for Lean/Mathlib that retrieves relevant theorems, outperforming GPT models and earning strong reception in the AI-for-math community. Together, these efforts aim to close the loop between automated reasoning and human heuristics across diverse, verifiable scientific tasks.

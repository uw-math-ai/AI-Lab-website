  - type: project
    title: Proving Strong Normalization of the Calculus of Constructions
    id: proving-strong-normalization-of-the-calculus-of-constructions
    style: list
    details:
      - label: "Student:"
        content: Dowland Aiello
      - label: "Mentors:"
        content: Jarod Alper and Vasily Ilin
      - label: "Description:"
        content: Proofs of strong normalization of the simply-typed lambda calculus have been exhaustively
          enumerated in the literature. A common strategy invented by W. W. Tait known as "Tait's
          method," (Robert Harper, 2022) interprets types as sets of "well-behaving" terms which are
          known to be strongly normalizing and composed of expressions in some such set. Strong
          normalization of the typed SK combinator calculus has been comparatively under-studied.
          Herein, I demonstrate that the typical proof of strong normalization using Tait's method
          holds for the typed SK combinator calculus. I also show that decomposition of the STLC
          into SK combinator expressions simplifies the typical proof of strong normalization.
      - content: "Github repo: [here](https://github.com/dowlandaiello/coc-lean)"
      - content: "Book: [here](https://dowlandaiello.com/sk-lean/)"
  - type: project
    title: Formalizing Vizing’s Theorem in Lean
    id: formalizing-vizing-s-theorem-in-lean
    style: list
    details:
      - label: "Students:"
        content: Zayna Aarbi, Helinda He, and Manish Gatti
      - label: "Mentors:"
        content: Jarod Alper and Vasily Ilin
      - label: "Description:"
        content: "The goal is to formalize Vizing’s Theorem: every simple, undirected graph may be properly
          edge colored using a number of colors that is at most one larger than the maximum degree
          of the graph."

  - type: project
    title: Regular Local Rings
    id: regular-local-rings
    style: list
    details:
      - label: "Contributors:"
        content: Jarod Alper and Brian Nugent
      - label: "Description:"
        content: We have formalized the definition and some of the first properties of regular local rings.
          Specifically, we have proved that regular local rings are domains and that one dimensonal
          regular local rings are PIDs. We hope to further formalize (1) relationships between
          regular local rings and regular sequences, (2) Koszul complex, (3) regular local rings are
          Cohen-Macaulay, (5) characterization of regularity in terms of projective dimension
          (Auslander-Buchsbaum-Serre), and (6) regular local rings are UFDs (Auslander-Buchsbaum).
      - content: "Github repo: [here](https://github.com/JarodUW/RegularLocalRings)"

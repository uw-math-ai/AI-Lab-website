blocks:
  - type: project
    title: Formalizing Polyhedral Geometry
    id: formalizing-polyhedral-geometry
    style: list
    details:
      - label: "Mentors:"
        content: Caelan Ritter and Freda Zheng, Mathematics
      - label: "Students:"
        content: Seven Lewis and George Peykanu
      - label: "Description:"
        content: In this project, the goal is to formalize the basic results in polyhedral geometry, up to
          the equivalence of definitions of a polyhedron in terms of halfspaces and convex hulls. A
          polyhedron is a generalization of a polygon to n dimensions. We can define it either as an
          intersection of finitely many half-spaces (i.e., the closure of one “side” of a
          hyperplane) or, if it is bounded, as the “convex hull” of finitely many points. An
          explicit goal of this project is to formalize enough of the basic definitions and results
          in polyhedral geometry so that we can write down the equivalence of the two definitions
          above. We will follow the proof outline in chapter 1 of Gaku Liu's
          [notes](https://drive.google.com/file/d/1TRg7iQ0RpIRteF2IUiKIe3E-YagVnkH0/view?usp=sharing).
      - content: "Github repo: [here](https://github.com/uw-math-ai/lean-polyhedral-geometry)"
  - type: project
    title: Reinforcement Learning for Efficient Arithmetic Circuit Generation of Polynomials
    id: reinforcement-learning-for-efficient-arithmetic-circuit-generation-of-polynomials
    style: list
    details:
      - label: "Students:"
        content: Alexandre Borentain, Hansel Lee, Claire Xu, and Weikun Zhang
      - label: "Mentors:"
        content: Prof. Jarod Alper, Mathematics
      - label: "Description:"
        content: We will attempt to use reinforcement learning to train computers to search for efficient
          arithmetic circuits computing specific polynomials. In some sense, this is a simplified
          version of proof generation, where computers are trained to search for proofs of theorems,
          except that in this case the search space is smaller. Our inspiration is the AlphaZero
          algorithm for two-players games, which we will adapt to a one-player game. The problem we
          will attack is to find efficient ways to compute a polynomial f(x\_1, ..., x\_n) using an
          arithmetic circuit consisting of + and x gates together with scalar multiplication. Our
          strategy is to use Monte Carlo Tree Search to train a deep neural network to learn an
          effective evaluation function (giving a score of how close the current state is from
          computing the polynomial) and a policy (a probability distribution over the next moves,
          with higher probability given to moves that simplify the expression). The computer is
          rewarded when it finds efficient arithmetic circuits.
      - content: "Github repo: [here](https://github.com/uw-math-ai/PolyArithmeticCircuitsRL)"
  - type: project
    title: Metaprogramming and Writing New Tactics
    id: metaprogramming-and-writing-new-tactics
    style: list
    details:
      - label: "Mentors:"
        content: Dhruv Bhatia, Mathematics
      - label: "Students:"
        content: Dowland Aiello, Joseph Qian, Veer Shukla, Annis Wu,
      - label: "Description:"
        content: Teaching a person a proof is one thing, but explaining it to a computer is another beast.
          The computer demands explicit precision, down to the tiniest of details. Thus, any good
          theorem prover needs tools, or "tactics", that make theorem proving less tedious, and more
          akin to the way people reason. Lean comes with a built-in "metaprogramming" framework that
          allows users to build custom tools for automatic proof generation of specific goals. In
          this project, students learn about functional programming and monads before tackling the
          basics of metaprogramming. At the end, they write their own tactics. The current task at
          hand is to write a tactic that can, given a set of hypotheses of the form "a < b" where a
          and b come from a partially ordered type, automatically prove a goal of the same form by
          chaining together relevant hypotheses. We use the book [Metaprogramming in Lean
          4](https://leanprover-community.github.io/lean4-metaprogramming-book/) as a reference.
      - content: "Github repo: [here](https://github.com/dhruvashok/partial_order_tactic.git)"
  - type: project
    title: Neural Theorem Proving
    id: neural-theorem-proving
    style: list
    details:
      - label: "Mentors:"
        content: Vasily Ilin, Mathematics
      - label: "Students:"
        content: Henry Adams, Siyuan Ge, Attila Jamilov, Elizabeth Wang.
      - label: "Description:"
        content: Formalization is the process of translating human-written mathematical proofs into a form
          that can be verified by a computer. A popular tool for this is Lean, a proof assistant
          that represents proofs as code. However, the process of formalizing proofs in Lean can be
          slow and time-consuming. Our research explores neural theorem proving strategies, which
          aim to automate the generation of Lean proofs. We propose a tree-based search framework to
          formalize mathematical theorems in Lean using Language Models. This approach explores
          potential proof steps as branches in a tree, using AI models to suggest "tactics" at each
          node. This has the benefit of avoiding hallucinations by rigorously checking that AI
          suggestions represent valid Lean code. We employ both Large Language Models such as Claude
          Sonnet 3.5 and specialized fine-tuned Small Language Models such as Lean-Dojo. We use
          Pantograph to interact with Lean, leveraging its native support of Monte Carlo tree
          search. We assemble a small set of simple and medium-difficulty mathematical theorems to
          benchmark against, called nanoF2F. Additionally, we benchmark our system on the
          well-established miniF2F benchmark created by OpenAI.
      - content: "Github repo: [here](https://github.com/uw-math-ai/autoformalization-with-llms)"
  - type: project
    title: Matrix Manipulation and Linear Algebra in Lean
    id: matrix-manipulation-and-linear-algebra-in-lean
    style: list
    details:
      - label: "Mentors:"
        content: Prof. Eric Klavins, Electrical and Computer Engineering and Haoming Ning
      - label: "Students:"
        content: David Bataresh and Hemkesh Bandi
      - label: "Description:"
        content: Lean is a proof assistant that can be used to encode and check mathematical results in
          machine readable code and could one day be used to assist in the development of complex
          engineering systems. First, however, we need to teach it the foundations of engineering
          mathematics. In this project, students will contribute to a Lean library of basic results
          and tactics involving matrices and linear algebra. The overall goal is to support
          reasoning about a variety of engineering areas that depend on linear algebra, including
          control systems, quantum computing, and machine learning. Thus, sub-projects will begin
          with a result in one of these areas and work backwards to the basic results needed to
          support that result.
      - content: "Github repo: [here](https://github.com/HemkeshB/relations-linAlg-SP25-LEAN)"

  - type: project
    title: Formalizing using LLMs
    id: formalizing-using-llms
    style: list
    details:
      - label: "Students:"
        content: Drew Bladek, Simon Chess, and Evan Wang
      - label: "Mentors:"
        content: Jarod Alper and Vasily Ilin
      - label: "Description:"
        content: Large language models (LLMs) have demonstrated fairly impressive results in mathematical
          reasoning and proof generation. However, when applied to the LEAN proof assistant, these
          models tend to generate code with subtle syntax errors, limiting their practical utility
          in auto formalization without human intervention. In this work, we will focus on improving
          the syntactic fluency of LLMs when generating Lean code, without targeting the correctness
          of mathematical content itself. We curate a small but diverse dataset of Lean code
          snippets and fine-tune an open-source LLM, and evaluate the syntactic validity of the
          model's outputs using automated Lean parsers.
      - content: "Github repo: [here](https://github.com/aurasoph/lean-dataset)"

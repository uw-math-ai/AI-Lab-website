  - type: project
    title: The six-color theorem
    id: the-six-color-theorem
    style: list
    details:
      - label: "Students:"
        content: Sravani Panuganti, Jeb Song, and Taylor Woodward
      - label: "Mentors:"
        content: Jarod Alper and Vasily Ilin
      - label: "Description:"
        content: Every simple planar graph can be properly colored with six colors. The motivation is that
          this a stepping stone to the more general "fiver-color theorem", which in turn is a
          stepping stone to the "four-color theorem".
      - content: "Github repo: [here](https://github.com/SravaniPanu/25sp-6color)"
      - content: "Slides:

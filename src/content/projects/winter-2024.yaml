  - type: project
    title: Witt's Cancellation Theorem
    id: witt-s-cancellation-theorem
    style: list
    intro: (continuation from Fall 2023)
    details:
      - content: "Thm: Let ⟨-,-⟩ be a symmetric bilinear form (i.e. ⟨x,y⟩ = ⟨y,x⟩ for all x,y ∈ V). Suppose
          that there is form-preserving map g: U → U' where U, U' ⊂ V are subspaces. Then there is a
          form-preserving map f: V → V extending g."
      - content: "Cor: U ⊕ V ≅ W ⊕ V ⟹ U ≅ W."
      - content: "Members: Andy Heald, Nathan Louie, Sarah Mathison, Qiguang Yan"
  - type: project
    title: Formalizing Math 300
    id: formalizing-math-300
    style: list
    intro: (continuation from Fall 2023)
    details:
      - content: "Goal: Formalize the exercises (and possibly results) in the Math 300 textbook by
          Conroy--Taggart: _An Introduction to Mathematical Reasoning_."
      - content: Write a Lean guide for students taking Math 300
      - content: "Members: Chengyu (Kenneth) Gong, Rina Reimer, Tess Gerrard, Anthony Xing, Yanzhe (Steven)
          Zhong"
      - content: "[GitHub code](https://github.com/StevennZZZ/FormalizingMATH300/)"

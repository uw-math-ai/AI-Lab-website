  - type: project
    title: AI-Assisted Proof Discovery in Inverse Boundary Problems
    id: ai-assisted-proof-discovery-in-inverse-boundary-problems
    style: heading
    details:
      - label: "Area:"
        content: Autoresearch
      - label: "Project Leaders:"
        content: Ruirui Wu <ruirwu@uw.edu>, Zihong Lin <zhlin@uw.edu>
      - label: "Abstract:"
        content: >-
          Inverse problems seek to determine properties of a medium by exterior measurements. As a
          prototypical example, the Calderón problem asks whether we can determine the electrical
          conductivity of a medium by making voltage and current measurements on the boundary.

          This project investigates how AI can assist in the discovery of proof in inverse boundary
          problems. Our main target is to relax the data observation set geometry requirement for
          the partial data Calderón problem in dimension 3 or higher: when both applied voltages and
          measured currents are restricted to the same arbitrary open subset of the boundary.

          We will use AI to analyze existing results and proofs, identify obstacles to extending
          them, and develop and attempt new proofs. The mathematical correctness will be audited by
          the project leader and possibly team members with corresponding math background.
      - label: "Planned contributions:"
        content: "We plan two connected contributions: An open-source workflow for AI-assisted proof
          development, including retrieval of relevant results and iterative proposal and criticism
          of candidate arguments. A formalization of new intermediate results for the partial data
          Calderón problem with applied voltages and measured currents restricted to the same
          arbitrary open subset of the boundary, which can be included in a mathematical paper."

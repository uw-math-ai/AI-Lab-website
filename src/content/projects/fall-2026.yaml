  - type: project
    title: Autoformalizing Mathematical Benchmarks
    id: autoformalizing-mathematical-benchmarks
    style: heading
    details:
      - label: "Area:"
        content: Autoformalization
      - label: "Project Leader:"
        content: Theodore Meek <theomeek@uw.edu>
      - label: "Members (continuing):"
        content: Michael R. Zeng <zengrf@uw.edu>, Pei Li <peilinli@uw.edu>
      - label: "Abstract:"
        content: Formalize two natural-language, research-level benchmarks, LemmaBench and OpenConjecture,
          using an agentic workflow in which AI agents check and refine one another's work. Every
          resulting statement also receives human review and is classified as faithful, uncertain,
          or unfaithful.
  - type: heading
    title: Mathematical Machine Learning
    id: mathematical-machine-learning
    level: 2
  - type: project
    title: PermuFormer 2
    id: permuformer-2
    style: heading
    details:
      - label: "Area:"
        content: AI and machine learning for math
      - label: "Project Leaders:"
        content: Henry Kvinge <hjk3@uw.edu>, Michael R. Zeng <zengrf@uw.edu>, Junaid Hasan
          <junaid01@uw.edu>; graduate mentors Treanungkur Mal <maltreanungkur@gmail.com>, Ron Cherny
          <rcherny@uw.edu>
      - label: "Abstract:"
        content: "The continuation of Permuformer: train a small language model on a broad curriculum of
          algebraic combinatorics tasks, building balanced training and evaluation sets for
          partitions, Young tableaux, and other core combinatorial objects. We might gain the
          following two kinds of results: - a better understanding of how complex reasoning ability
          emerge from modern LLMs; - new conjectures and theorems from patterns captured by these
          specialized models."
  - type: project
    title: "ProofMem: Separating Proof Replay from Proof-Pattern Generalization in Lean Theorem Proving"
    id: proofmem-separating-proof-replay-from-proof-pattern-generalization-in-lean-theorem-proving
    style: heading
    details:
      - label: "Area:"
        content: AI and machine learning for math
      - label: "Project Leader:"
        content: Yue Wu <yuew29@uw.edu>
      - label: "Members (continuing):"
        content: Zhi Chen, Jayme Kim <hyungoo@uw.edu>
      - label: "Abstract:"
        content: Do LLMs memorize proof logic, or just do pattern matching? Build a controlled Lean
          evaluation framework that distinguishes exact proof replay from genuine proof-pattern
          generalization, testing robustness under theorem perturbations, transfer to sibling
          theorems, and retention after further fine-tuning.
  - type: heading
    title: Math Education
    id: math-education
    level: 2
  - type: project
    title: Math Tutor / Polya
    id: math-tutor-polya
    style: heading
    details:
      - label: "Area:"
        content: AI for math learning and education
      - label: "Project Leaders:"
        content: Eric Klavins <klavins@uw.edu>; Dan Mikulincer <danmiku@uw.edu> [tentative — intent to be
          confirmed]
      - label: "Abstract:"
        content: The goal of this project is to teach mathematics to a student in a goal-directed approach
          informed by an estimation of the student's knowledge built up from assessing their
          performance on a set of problems. Using a combination of agent-based LLMs, the Lean proof
          assistant, and model-predictive students are served custom made problems that extend their
          knowledge and skills optimally fast. A prototype of this approach, called Polya, has been
          developed by the Klavins lab and can teach basic topology among other subjects. Students
          working on this project will extend the approach by designing and and testing new agentic
          harnesses and by developing new curricula.
  - type: project
    title: AI Math Textbook
    id: ai-math-textbook
    style: heading
    details:
      - label: "Area:"
        content: AI for math learning and education
      - label: "Project Leaders:"
        content: Giovanni Inchiostro, Dhruv Bhatia <dbhatia1@uw.edu>
      - label: "Abstract:"
        content: "Turn an existing wall-of-text PDF into an interactive, HTML-based learning experience.
          Every piece of terminology becomes clickable, opening a hovering window with the full
          definition, and every cross-reference opens the full statement the same way. A chatbot
          holds the whole paper in context so the learner can ask questions in real time. The
          embellished version should contain far more flowcharts, mindmaps, and schematics, with two
          levels of presentation: undergraduate and graduate/researcher."
  - type: project
    title: Code Certifications
    id: code-certifications
    style: heading
    details:
      - label: "Area:"
        content: AI for math learning and education
      - label: "Project Leaders:"
        content: Eric Klavins <klavins@uw.edu>, Dhruv Bhatia <dbhatia1@uw.edu>
      - label: "Abstract:"
        content: When an LLM produces, say, Python code for your project, how do you know that code is
          correct? One approach is to have it also produce a logical specification of what the code
          should do, together with a proof that the code meets the specification. For example, if
          you asked for code that sorts lists, you would get a function from lists to lists and a
          proof that the function is decidable and correct. The team will build a custom agentic
          harness and a Lean evaluator, and use an off-the-shelf Lean to Python translator.
  - type: project
    title: Formalizing the Scientific Method
    id: the-scientific-method
    style: heading
    details:
      - label: "Area:"
        content: AI for math learning and education
      - label: "Project Leader:"
        content: Eric Klavins <klavins@uw.edu>
      - label: "Abstract:"
        content: "The goal of this project is to formalize the scientific method in Lean and LLMs in an
          attempt to answer the question: Can the experiments done in a given scientific paper
          refute hypotheses derived from a mathematical model of the physics involved. For example,
          given a model of a gene network, a hypothesis about a particular gene interaction, and a
          molecular perturbation, does the perturbation provide information about the interaction?"

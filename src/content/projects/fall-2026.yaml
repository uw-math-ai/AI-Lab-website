  - type: project
    title: Albilich v2 + Internal Tools
    id: albilich
    style: heading
    details:
      - label: "Area:"
        content: Autoresearch and autoformalization infrastructure
      - label: "Project Leaders:"
        content: Ting Gong <tgong2@uw.edu>, Michael R. Zeng <zengrf@uw.edu>, Dean Light
          <deanlcs@cs.washington.edu>, Michael Theologitis <mthe@cs.washington.edu> [Dean and
          Michael T. on the recursive self-improvement (RSI) aspects]
      - label: "Abstract (Albilich v2):"
        content: >-
          This project develops Albilich v2, a recursively self-improving AI system for mathematical
          research. Building on Albilich v1's auditable proof-state architecture, v2 will turn
          research experience itself into a source of improvement: learning from successful
          reductions, failed strategies, verifier feedback, literature use, tool calls, and software
          failures.

          Some of the wanted outcomes are to study whether mathematical ability of harness can be
          improved recursively, as well as to study whether AI's ability in a specific area can be
          improved via learnt skills with small amount of data.
      - label: "Internal tools:"
        content: "Host and maintain the lab's internal tools on EC2: the Albilich autoresearch system,
          autoformalization tools (Polya and the benchmark tool), MCP tool calling, and
          TheoremSearch."
  - type: project
    title: Learning Conditional Return Laws from Financial Trading Signals
    id: learning-conditional-return-laws-from-financial-trading-signals
    style: heading
    details:
      - label: "Area:"
        content: Autoresearch
      - label: "Project Leaders:"
        content: Freda Zhang <qzhang52@uw.edu>, Yue Wu <yuew29@uw.edu>
      - label: "Abstract:"
        content: Learn the full conditional distribution of future asset returns from trading signals, going
          beyond expected return to model volatility, tail risk, and downside probability. The
          learned distributions will be evaluated using calibration, probability integral transform
          diagnostics, value-at-risk violations, and proper scoring rules.
  - type: heading
    title: Formalization & Autoformalization
    id: formalization-autoformalization
    level: 2
  - type: project
    title: Formalizing Algebra of Resultants and Determinantal Polynomials
    id: formalizing-algebra-of-resultants-and-determinantal-polynomials
    style: heading
    details:
      - label: "Area:"
        content: Formalization
      - label: "Project Leaders:"
        content: Joe Rogge <jwrogge@uw.edu>, Bryan Boehnke <boehnkeb@uw.edu>, Shaoda Ji <shaodj@uw.edu>
      - label: "Abstract:"
        content: The principal minor map, sending an nxn matrix to its vector of 2^n principal minors, has
          been extensively studied, with many properties of its fiber understood. The primary tools
          used in studying this map are determinantal polynomials (multiaffine polynomials
          organizing principal minors) and resultants, allowing elementary but powerful analysis of
          principal minor questions. Principal minors are of special interest because of so-called
          determinantal point processes (DPP's), probability distributions on subsets of [n] defined
          by the principal minors of an nxn matrix. In this project, we will formalize some recently
          published results on principal minors, and along the way we will formalize some classical
          theorems about determinants which are not yet in Mathlib. This project provides an
          accessible entry point both to cutting edge mathematics and to formalization, with some
          easy results ready to be formalized and a clear ladder of results of increasing
          difficulty.
      - label: "Goal:"
        content: "Formalize theorems about resultants and multiaffine polynomials from the following paper:
          https://arxiv.org/abs/2309.00806. The natural starting point is theorem 2.1 (proven as
          theorem 3.1 in https://arxiv.org/abs/2205.05267 by ~3 pages of natural language), which
          should on its own provide a challenging but achievable goal. Formalizing this proof will
          involve formalizing the Desnanot–Jacobi identity, an important determinantal identity not
          yet in Mathlib; this project would contribute classical as well as cutting edge results to
          Mathlib. Natural extensions would be formalizing so-called principal minor equivalence,
          treated in https://arxiv.org/abs/2410.01961, or Hermitian determinantal representations,
          treated in https://arxiv.org/abs/2205.05267. Assuming sufficient progress is made, we will
          submit Mathlib PR's every quarter."

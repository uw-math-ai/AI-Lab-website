  - type: project
    title: Witt's Cancellation Theorem
    id: witt-s-cancellation-theorem
    style: list
    details:
      - label: "Thm:"
        content: "Let ⟨-,-⟩ be a symmetric bilinear form (i.e. ⟨x,y⟩ = ⟨y,x⟩ for all x,y ∈ V). Suppose that
          there is form-preserving map g: U → U' where U, U' ⊂ V are subspaces. Then there is a
          form-preserving map f: V → V extending g."
      - label: "Cor:"
        content: U ⊕ V ≅ W ⊕ V ⟹ U ≅ W.
      - label: "Members:"
        content: Andy Heald, Nathan Louie, Sarah Mathison, Qiguang Yan
  - type: project
    title: Random Graphs
    id: random-graphs
    style: list
    details:
      - label: "Goal:"
        content: "Build a random graph G(n,p) with n = # of nodes with p = probability of an edge. Show that
          the expected number E(# edges in G(n,p)) of edges in a random graph G(n,p) is (n choose
          2)p."
      - label: "Related goals:"
        content: compute other expected numbers, e.g. number of triangles in a random graph.
      - label: "Members:"
        content: Zhongrui An, Hermann Chau, Vasily Ilin, George King, Benjamin Li, Yu He Zhang
      - content: "[GitHub code](https://github.com/Vilin97/random_graphs)"
  - type: project
    title: Formalizing Math 300
    id: formalizing-math-300
    style: list
    details:
      - label: "Goals:"
        content: |-

blocks:
  - type: text
    content: |-
      Project teams meet Mondays and Wednesdays from 4–5:30 pm in Odegaard 136.

      The goal of projects is a **publication** or a **significant open-source contribution**, e.g. to [mathlib4](https://github.com/leanprover-community/mathlib4). Students are expected to commit at least 5 hours per week to their project outside of meeting times.
  - type: heading
    title: Autoformalization projects
    id: autoformalization-projects
    level: 2
  - type: text
    content: The goal of autoformalization projects is to use Lean-specific AI assistants such as
      Harmonic’s [Aristotle](https://aristotle.harmonic.fun/) to formalize large chunks of
      mathematics, and contribute to [mathlib4](https://github.com/leanprover-community/mathlib4).
  - type: project
    title: "OpenMath: autoformalizing undergraduate textbooks"
    id: openmath-autoformalizing-undergraduate-textbooks
    style: heading
    details:
      - label: "Project Leader:"
        content: Vasily Ilin
      - label: "Description:"
        content: "Most undergraduate mathematics is present in
          [mathlib](https://leanprover-community.github.io/mathlib4_docs/), but several big gaps
          remain: differential geometry, partial differential equations, numerical analysis. We will
          autoformalize undergraduate textbooks on numerical analysis of differential equations,
          starting with Iserles’s _A First Course in the Numerical Analysis of Differential
          Equations_ and Butcher’s _Numerical Methods for Ordinary Differential Equations_. Since
          manual formalization is time-consuming, we will build a semi-autonomous AI agent along the
          way, automating more of the process as the project progresses. **Goal:** workshop paper at
          the [AI for Math workshop](https://ai4math2026.github.io/) at ICML 2026 (deadline May
          25)."
      - label: "Code:"
        content: "[GitHub repo](https://github.com/uw-math-ai/OpenMath)"
      - label: "Members:"
        content: Vasily Ilin, Theo Meek, Siyuan Ge, Saumi Joshi, Di Qiu Xiang
      - label: "Prerequisites:"
        content: Lean, undergraduate analysis
  - type: project
    title: "LeanGCD: stabilizing Lean generation"
    id: leangcd-stabilizing-lean-generation
    style: heading
    details:
      - label: "Project Leaders:"
        content: Dean Light and Michael Theologitis
      - label: "Description:"
        content: "LeanGCD aims to improve Lean proof generation by frontier large language models using
          inference-time stabilization methods rather than retraining. The project adapts
          [grammar-constrained decoding techniques](https://arxiv.org/abs/2305.13971) with Lean’s
          [syntax
          extensions](https://lean-lang.org/doc/reference/latest/Notations-and-Macros/Defining-New-\
          Syntax/). Planned contributions: a Lean-specific GCD implementation that plugs into
          HuggingFace/vLLM inference pipelines, and empirical evaluation on MiniF2F, ProverBench,
          and PutnamBench. **Goal:** ICML 2026 (October) or 2027 (January)."
      - label: "Code:"
        content: "[GitHub repo](https://github.com/DeanLight/LeanGCD)"
      - label: "Members:"
        content: Evan Wang, Ben Bioren, Naren P Ramakrishnan, Nhan Pham
      - label: "Prerequisites:"
        content: Python, ML / LLM inference experience
  - type: project
    title: "Mathematician's copilot: Semantic Theorem Search"
    id: mathematician-s-copilot-semantic-theorem-search
    style: heading
    details:
      - label: "Project Leaders:"
        content: Giovanni Inchiostro and Vasily Ilin
      - label: "Description:"
        content: "We help research mathematicians find relevant theorems quickly. We collected the dataset
          of all theorems on ArXiv, Stacks Project and other sources, and built vectorized search
          over it. Goal: submit to ICML 2026 in January."
      - label: "Demo:"
        content: "[HF link](https://huggingface.co/spaces/uw-math-ai/theorem-search)"
      - label: "Members:"
        content: Eric Leonen, Sophie Szeto, Artemii Remizov, Luke Alexander
      - label: "Code:"
        content: "[GitHub repo](https://github.com/uw-math-ai/TheoremSearch)"
  - type: project
    title: "Mathematician's copilot: Math2Vec"
    id: mathematician-s-copilot-math2vec
    style: heading
    details:
      - label: "Project Leader:"
        content: Henry Kvinge (PNNL)
      - label: "Members:"
        content: Saharsh Bhargava, Michael Cecilia, Jiahe Lu, Kedar Chintalapati, Rachit Jaiswal, Samarth
          Rao, Jared Darlington, Leo Carlin
      - label: "Description:"
        content: "Train a text embedder that understands math, LaTeX and Lean. This will improve search over
          Lean, and natural language theorem search. It can be used for RAG as well. Use arXiv,
          MathOverflow, mathlib, Lean Reservoir, and possibly other sources. Create an evaluation
          benchmark as well. Goal: submit to EMNLP 2026 in May."
  - type: project
    title: How good are LLMs at Lean?
    id: how-good-are-llms-at-lean
    style: heading
    details:
      - label: "Project Leader:"
        content: Tyson Klingner
      - label: "Description:"
        content: Design an evaluation procedure for various Lean tasks such as next step generation or
          entire proof generation. Run our algorithms on frontier models to see which LLMs perform
          the best, providing guidance to the Lean community on which LLMs to use. Use a scalable
          architecture so that our algorithms can be rerun when new models are released.
      - label: "Code:"
        content: "[GitHub repo](https://github.com/uw-math-ai/LLMsLean)"
      - label: "Members:"
        content: Escher Crawford, Drew Bladek
  - type: heading
    title: Machine learning for math projects
    id: machine-learning-for-math-projects
    level: 2
  - type: text
    content: The goal of AI projects is to use AI and ML to advance mathematical research. For example,
      by helping mathematicians find relevant theorems, or by training models to learn mathematical
      functions or by creating math-specific datasets or models. AI projects are expected to result
      in a publication in a submission to a major ML conference such as ICML, ICLR, EMNLP or
      Neurips.

  - type: project
    title: AI for Quantum Code Compilation
    id: ai-for-quantum-code-compilation
    style: heading
    details:
      - label: "Project Leader:"
        content: Andres Paz
      - label: "Description:"
        content: |-
          Quantum error correction (QEC) codes are traditionally described using stabilizers, which define the subspace preserved by the code. However, implementing these codes requires translating stabilizers into fault-tolerant quantum circuits—an inherently nontrivial task that depends on the constraints and capabilities of the underlying hardware architecture.

          This project aims to develop an AI agent capable of synthesizing such circuits in a way that:

          1.  In the ideal (noiseless) setting, the resulting circuits implement the intended stabilizer structure of the code on the target architecture.
          2.  In the noisy setting, the agent searches over circuit variations to optimize fidelity, taking into account realistic noise models and architectural constraints.

          The outcome would be a toolchain bridging the gap between abstract QEC code design and concrete, high-performance circuit implementations, enabling better exploration of architecture-specific tradeoffs in fault-tolerant quantum computing.
      - label: "Preprint:"
        content: "[StabilizerBench: A Benchmark for AI-Assisted Quantum Error Correction Circuit
          Synthesis](https://arxiv.org/abs/2604.21287)"
      - label: "Members:"
        content: Christian Tarta, Sylvie Lausier, Mayee Sun, Sarju Patel
  - type: heading
    title: Formalization projects

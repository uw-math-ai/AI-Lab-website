  - type: project
    title: "Formalization: zero-knowledge proofs"
    id: formalization-zero-knowledge-proofs
    style: heading
    details:
      - label: "Project Leaders:"
        content: Eric Klavins and Alexandra Aiello
      - label: "Description:"
        content: We would outline a framework for verifying mathematical theorems while keeping the
          respective proofs secret by leveraging dependent combinatory logic as a host language for
          Zero-Knowledge (ZK) proof circuits. Specifically, we would interpret the axioms of the
          dependent SK combinator calculus as a universal ZK circuit capable of checking
          mathematical proofs encodeable in the calculus. We would target ZK-STARKs as our ideal ZK
          scheme, enabling quantum resistance of the proofs without trusted setup \[Ben+18\]. This
          would be a first-of-its kind result, with wide applications. **Goal:** publication
      - label: "Prerequisites:"
        content: Lean, type theory
  - type: project
    title: "Metaprogramming: Provable Computation in Lean"
    id: metaprogramming-provable-computation-in-lean
    style: heading
    details:
      - label: "Project Leader:"
        content: Dhruv Bhatia
      - label: "Description:"
        content: While Lean has seen extensive use as a theorem-proving assistant, its capabilities as a
          computational programming language have been underutilized. The goal of this project is to
          begin filling that gap. Along the way, we will learn the basics of functional programming,
          monads, and Lean’s metaprogramming framework to implement algorithms that can both be run
          efficiently and be reasoned about. Our main goal is to implement basic algorithms with
          applications to linear algebra while also proving (in Lean) correctness of said
          algorithms.
      - label: "Members:"
        content: Joseph Qian, Junye Ji, Veer Shukla, Alan Chang
      - label: "Code:"
        content: "[GitHub repo](https://github.com/uw-math-ai/provable_computation)"

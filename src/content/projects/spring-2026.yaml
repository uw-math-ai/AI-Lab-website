    level: 2
  - type: project
    title: Geometric Invariant Theory (GIT)
    id: geometric-invariant-theory-git
    style: heading
    details:
      - label: "Project Leaders:"
        content: Arkamouli Debnath, Giovanni Inchiostro, Leo Mayer
      - label: "Description:"
        content: |-
          Geometric Invariant Theory (GIT) is the theory of taking quotients in algebraic geometry. At present, there is almost no formalization of GIT in Lean on mathlib, and this presents the unique opportunity to contribute in two different directions as follows:

          1.  **Commutative algebra:** Our main goal is to formalize the definition of a linearly reductive group and prove the theorem: "If a linearly reductive group _G_ acts locally finitely on a finitely generated _k_\-algebra _R_, then the invariant ring _RG_ is a finitely generated _k_\-algebra." The fact that a finite group is linearly reductive (Maschke's theorem) is already in mathlib, and that proof uses the existence of a "Reynolds operator". As part of this formalization project, we define a Reynolds operator and prove its existence (in Lean) for any linearly reductive group.
          2.  **Geometry:** The main content of GIT is to define a "good quotient". We aim to formalize the definition.
      - label: "Code:"
        content: "[GitHub repo](https://github.com/uw-math-ai/Formalizing-geometric-invariant-theory-GIT-)"
      - label: "Members:"
        content: Xuanyu Yang, Emily Meng, Bohan Zhao, Jacob Boyce
      - label: "Prerequisites:"
        content: Lean, commutative algebra or algebraic geometry

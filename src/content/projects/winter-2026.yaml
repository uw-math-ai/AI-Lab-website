  - type: project
    title: "Mathematician's copilot: Math2Vec"
    id: mathematician-s-copilot-math2vec
    style: heading
    details:
      - label: "Project Leader:"
        content: Henry Kvinge (PNNL)
      - label: "Members:"
        content: Saharsh Bhargava, Cecilia, Jiahe Lu, Michael, Kedar Chintalapati, Rachit Jaiswal, Samarth
          Rao, Jared Darlington, Leo Carlin
      - label: "Description:"
        content: "Train a text embedder that understands math, LaTeX and Lean. This will improve search over
          Lean, and natural language theorem search. It can be used for RAG as well. Use arXiv,

  - type: project
    title: How good are LLMs at Lean?
    id: how-good-are-llms-at-lean
    style: heading
    details:
      - label: "Project Leader:"
        content: Tyson Klingner
      - label: "Description:"
        content: Design an evaluation procedure for various Lean tasks such as next step generation or
          entire proof generation. Run our algorithms on frontier models to see which LLMs perform
          the best, providing guidance to the Lean community on which LLMs to use. Use a scalable
          architecture so that our algorithms can be rerun when new models are released.
      - label: "Members:"
        content: Escher Crawford, Drew Bladek
  - type: heading
    title: Machine learning for math projects
    id: machine-learning-for-math-projects
    level: 2
  - type: text
    content: The goal of AI projects is to use AI and ML to advance mathematical research. For example,
      by helping mathematicians find relevant theorems, or by training models to learn mathematical
      functions or by creating math-specific datasets or models. AI projects are expected to result
      in a publication in a submission to a major ML conference such as ICML, ICLR, EMNLP or
      Neurips.

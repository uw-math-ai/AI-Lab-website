    id: project
    level: 3
  - type: text
    content: |-
      Formalizing solutions to exercises from undergraduate math textbooks such as:

      -   Axler's book [Algebra Done Right](https://linear.axler.net/)
      -   Mukres's book [Topology a first course](https://www.maths.ed.ac.uk/~v1ranick/papers/munkres.pdf)
      -   Silverman's book [A Friendly Introduction to Number Theory](https://www.math.brown.edu/~jhs/frint.html)
      -   Silverman and Tate's book, Rational Points on Elliptic Curves
      -   Folland's book [Advanced Calculus](https://www.math.umn.edu/~garrett/m/fun/notes_2013-14/02a_folland_real.pdf)
      -   Rudin's book [Principles of Mathematical Analysis](https://www.math.ucdavis.edu/~hunter/intro_analysis_pdf/rudin.pdf)
      -   Hungerford's book [Abstract Algebra: An Introduction](https://www.math.ucla.edu/~rchua/math259/hungerford.pdf)

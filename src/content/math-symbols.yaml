- id: harmonic-analysis
  title: Harmonic analysis and microlocal geometry
  items:
    - id: fourier-extension
      name: Fourier extension operator
      tex: '\widehat{f\,d\sigma}'
      note: Restriction and extension operators in the harmonic analysis recognized in Hong Wang's citation.
      source: https://www.mathunion.org/fileadmin/documents/2026-07/Hong_Wang_Citations.pdf
    - id: wave-propagator
      name: Half-wave propagator
      tex: 'e^{it\sqrt{-\Delta}}f'
      note: Local smoothing for wave equations; Hong Wang with Guth and Zhang.
      source: https://www.mathunion.org/fileadmin/documents/2026-07/Hong_Wang_Citations.pdf
    - { id: wavefront-set, name: Wavefront set, tex: '\operatorname{WF}(u)' }
    - { id: microsupport, name: Microsupport of a sheaf, tex: '\operatorname{SS}(\mathcal F)' }
    - { id: microlocal-hom, name: Microlocal Hom, tex: '\mu\mathrm{hom}(\mathcal F,\mathcal G)' }
    - { id: semiclassical-operator, name: Semiclassical pseudodifferential operator, tex: '\operatorname{Op}_h(a)' }
    - id: kakeya-dimension
      name: Three-dimensional Kakeya theorem
      tex: '\dim_{\mathrm H}K=3\quad(K\subset\mathbb R^3\text{ Kakeya})'
      kind: formula
      note: Wang–Zahl. The Kakeya condition is displayed, not silently omitted.
      source: https://arxiv.org/abs/2502.17655
- id: probability-pde
  title: Probability and partial differential equations
  items:
    - { id: conditional-expectation, name: Conditional expectation, tex: '\mathbb E[X\mid\mathcal F]' }
    - { id: gaussian-distribution, name: Multivariate Gaussian, tex: '\mathcal N(0,\Sigma)' }
    - { id: brownian-differential, name: Brownian stochastic differential, tex: 'dW_t' }
    - { id: ising-correlation, name: Ising spin correlation, tex: '\langle\sigma_0\sigma_x\rangle_\beta', note: 'Statistical mechanics associated with Duminil-Copin; not notation introduced by him.', source: 'https://www.mathunion.org/imu-awards/fields-medal/fields-medals-2022' }
    - { id: heat-equation, name: Heat equation, tex: '\partial_tu=\Delta u', kind: formula }
    - id: boltzmann-equation
      name: Boltzmann equation
      tex: '\partial_tf+v\cdot\nabla_xf=Q(f,f)'
      kind: formula
      note: Kinetic equation derived from hard-sphere dynamics by Deng, Hani, and Ma; not an equation they introduced.
      source: https://arxiv.org/abs/2408.07818
    - id: nonlinear-schrodinger
      name: Cubic nonlinear Schrödinger equation
      tex: 'i\partial_tu+\Delta u=|u|^2u'
      kind: formula
      note: Representative defocusing cubic NLS, not a statement of the scope of Deng's theorems.
      source: https://www.mathunion.org/fileadmin/documents/2026-07/Yu_Deng_Citations.pdf
- id: combinatorics
  title: Combinatorics and Hodge theory
  items:
    - { id: binomial, name: Binomial coefficient, tex: '\binom nk' }
    - { id: random-graph, name: Erdős–Rényi random graph, tex: 'G(n,p)' }
    - { id: chromatic-polynomial, name: Chromatic polynomial, tex: '\chi_G(q)' }
    - { id: tutte-polynomial, name: Tutte polynomial, tex: 'T_G(x,y)' }
    - { id: schur-function, name: Schur symmetric function, tex: 's_\lambda' }
    - id: matroid-characteristic
      name: Reduced characteristic polynomial of a matroid
      tex: '\overline\chi_M(t)'
      note: Combinatorial Hodge theory of Adiprasito, Huh, and Katz.
      source: https://web.math.princeton.edu/~huh/MatroidHodge.pdf
    - id: matroid-lefschetz
      name: Hard Lefschetz for matroids
      tex: '\ell^{r-2k}:A^k(M)\xrightarrow{\sim}A^{r-k}(M)'
      kind: formula
      note: Adiprasito–Huh–Katz; real Chow ring of a loopless rank-(r+1) matroid, ample ell, 0 ≤ k ≤ r/2.
      source: https://web.math.princeton.edu/~huh/MatroidHodge.pdf

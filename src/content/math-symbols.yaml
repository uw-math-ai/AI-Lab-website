    - { id: hochschild-cohomology, name: Hochschild cohomology, tex: 'HH^*(A)' }
    - { id: maurer-cartan, name: Maurer–Cartan equation, tex: 'd\alpha+\tfrac12[\alpha,\alpha]=0', kind: formula }
- id: symplectic-geometry
  title: Symplectic and enumerative geometry
  items:
    - { id: cotangent-bundle, name: Cotangent bundle, tex: 'T^*M' }
    - { id: floer-cohomology, name: Lagrangian Floer cohomology, tex: 'HF^*(L_0,L_1)' }
    - { id: symplectic-cohomology, name: Symplectic cohomology, tex: 'SH^*(X)' }
    - { id: quantum-cohomology, name: Quantum cohomology, tex: 'QH^*(X)' }
    - id: wrapped-fukaya
      name: Wrapped Fukaya category
      tex: '\mathcal W(X)'
      note: Pardon with Ganatra and Shende; wrapped Fukaya categories of Liouville sectors.
      source: https://www.mathunion.org/fileadmin/documents/2026-07/John_Pardon_Citations.pdf
    - id: virtual-fundamental-class
      name: Virtual fundamental class of stable maps
      tex: '[\overline{\mathcal M}_{g,n}(X,\beta)]^{\mathrm{vir}}'

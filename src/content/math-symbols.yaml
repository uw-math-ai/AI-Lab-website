      source: https://www.mathunion.org/fileadmin/documents/2026-07/John_Pardon_Citations.pdf
    - id: holomorphic-curves
      name: Pseudoholomorphic curve equation
      tex: '\bar\partial_Ju=0'
      kind: formula
      source: https://www.mathunion.org/fileadmin/documents/2026-07/John_Pardon_Citations.pdf
- id: analysis
  title: Analysis and differential geometry
  items:
    - { id: lp-space, name: Lebesgue space, tex: 'L^p(\Omega)' }
    - { id: sobolev-space, name: Sobolev space, tex: 'H^s(\Omega)' }
    - { id: schwartz-space, name: Schwartz space, tex: '\mathcal S(\mathbb R^n)' }
    - { id: hilbert-sequences, name: Square-summable sequences, tex: '\ell^2' }
    - { id: gamma-function, name: Gamma function, tex: '\Gamma(z)' }
    - { id: bessel-function, name: Bessel function, tex: 'J_\nu(z)' }

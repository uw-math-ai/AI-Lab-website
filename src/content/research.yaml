    - venue: ICLR 2026, AI & PDE Workshop
      title: A Neural Score-Based Particle Method for the Vlasov-Maxwell-Landau System
      authors: Vasily Ilin, Jingwei Hu
      abstract: Plasma modeling is central to the design of nuclear fusion reactors, but simulating
        collisional plasma kinetics from first principles remains computationally challenging. This
        work introduces a neural score-based approach for the Vlasov-Maxwell-Landau system.
      url: https://openreview.net/forum?id=0wp8jxxxGT
      linkLabel: OpenReview
- id: preprints

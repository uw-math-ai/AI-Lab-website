    - venue: IEEE QCE 2026, QSYS track
      badge: Accepted
      title: "StabilizerBench: A Benchmark for AI-Assisted Quantum Error Correction Circuit Synthesis"
      authors: Andres Paz, Christian Tarta, Cordelia Yuqiao Li, Mayee Sun, Sarju Patel, Sylvie Lausier
      abstract: A benchmark suite for evaluating AI systems on synthesizing quantum error-correcting
        stabilizer circuits, with systematic coverage of code families and circuit constraints
